[project]
name = "wharton-research"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Reproducible portfolio research for the Wharton investment competition"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bt>=1.1,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "yfinance>=0.2.65",
  "plotly>=6",
  "matplotlib>=3.9,<4",
  "pyyaml>=6",
  "typer>=0.16",
  "psutil>=6",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "exchange-calendars>=4.11,<5",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
]

[project.scripts]
wharton = "wharton.cli:app"

[project.optional-dependencies]
gpu = [
    "torch>=2.6,<3",
]
handoff = [
    "cryptography>=46,<47",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "jupyterlab>=4",
    "nbformat>=5",
    "nbclient>=0.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wharton"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
